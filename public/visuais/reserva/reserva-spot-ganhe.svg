<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
  <title>Liquidez e Venda Instantânea Quando Quiser - Real Olímpico</title>
  <!-- Recibo pericial à esquerda em perspectiva -->
  <rect x="18" y="22" width="28" height="38" rx="2" stroke-width="2.5" />
  <line x1="24" y1="30" x2="38" y2="30" stroke-width="1.8" />
  <line x1="24" y1="36" x2="34" y2="36" stroke-width="1.5" stroke-opacity="0.6" />
  <line x1="24" y1="42" x2="40" y2="42" stroke-width="1.5" stroke-opacity="0.6" />
  <circle cx="32" cy="50" r="4" stroke-width="1.5" />

  <!-- Arco de transição / liquidez -->
  <path d="M 46 36 C 54 36, 60 40, 62 46" stroke-width="2" stroke-dasharray="2,2" />

  <!-- Moedas em cascata -->
  <!-- Moeda 1 caindo -->
  <ellipse cx="64" cy="46" rx="9" ry="5" stroke-width="2" />
  <!-- Moeda 2 na entrada da carteira -->
  <ellipse cx="66" cy="56" rx="10" ry="5.5" stroke-width="2" />

  <!-- Carteira elegante de custódia / liquidez -->
  <path d="M 42 66 C 42 62, 50 60, 68 60 C 78 60, 84 64, 84 68 L 84 80 C 84 84, 76 86, 64 86 C 50 86, 42 82, 42 78 Z" stroke-width="2.5" />
  <!-- Aba da carteira -->
  <path d="M 68 60 L 80 68 C 80 72, 74 74, 70 74 L 66 74" stroke-width="2" />
  <circle cx="73" cy="71" r="1.5" fill="currentColor" />
</svg>

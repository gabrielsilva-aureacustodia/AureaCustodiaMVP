<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 330 220" width="330" height="220" fill="none" stroke="currentColor">
  <title>Moldura Numismática Guilloché de Papel-Moeda - Real Olímpico</title>
  <defs>
    <!-- Roseta geométrica clássica para os 4 cantos -->
    <g id="roseta-canto">
      <circle cx="0" cy="0" r="14" stroke-width="1.2" stroke-dasharray="2,2" />
      <circle cx="0" cy="0" r="10" stroke-width="1" />
      <circle cx="0" cy="0" r="6" stroke-width="1" stroke-dasharray="1.5,1.5" />
      <circle cx="0" cy="0" r="2.5" fill="currentColor" stroke="none" />
      <!-- Pétalas curvas da roseta -->
      <path d="M -10 0 C -10 -6, -6 -10, 0 -10 C 6 -10, 10 -6, 10 0 C 10 6, 6 10, 0 10 C -6 10, -10 6, -10 0 Z" stroke-width="0.8" />
      <path d="M -7 -7 C -2 -11, 2 -11, 7 -7 C 11 -2, 11 2, 7 7 C 2 11, -2 11, -7 7 C -11 2, -11 -2, -7 -7 Z" stroke-width="0.8" />
    </g>
  </defs>

  <!-- Borda externa fina -->
  <rect x="4" y="4" width="322" height="212" rx="2" stroke-width="1" />

  <!-- Faixa de segurança de 6px com padrão geométrico cruzado -->
  <rect x="8" y="8" width="314" height="204" rx="1.5" stroke-width="1.5" />
  <rect x="14" y="14" width="302" height="192" rx="1" stroke-width="1" />
  
  <!-- Linhas decorativas da faixa de 6px (topo, base, esquerda, direita) -->
  <!-- Topo -->
  <line x1="28" y1="11" x2="302" y2="11" stroke-width="0.75" stroke-dasharray="4,2" />
  <!-- Base -->
  <line x1="28" y1="209" x2="302" y2="209" stroke-width="0.75" stroke-dasharray="4,2" />
  <!-- Esquerda -->
  <line x1="11" y1="28" x2="11" y2="192" stroke-width="0.75" stroke-dasharray="4,2" />
  <!-- Direita -->
  <line x1="319" y1="28" x2="319" y2="192" stroke-width="0.75" stroke-dasharray="4,2" />

  <!-- Moldura interna fina de certificado pericial -->
  <rect x="18" y="18" width="294" height="184" stroke-width="0.75" stroke-dasharray="6,3" />

  <!-- Quatro rosetas nos cantos -->
  <use href="#roseta-canto" x="18" y="18" />
  <use href="#roseta-canto" x="312" y="18" />
  <use href="#roseta-canto" x="18" y="202" />
  <use href="#roseta-canto" x="312" y="202" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <title>Padrão Guilloché de Segurança Monetária Institucional - Real Olímpico</title>
  <defs>
    <radialGradient id="bgGlow" cx="70%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#0D1B35" />
      <stop offset="60%" stop-color="#081226" />
      <stop offset="100%" stop-color="#050B17" />
    </radialGradient>
    <pattern id="guillochePattern" width="320" height="320" patternUnits="userSpaceOnUse">
      <!-- Traços de segurança matemática guilloché em dourado translúcido -->
      <path d="M 0 160 Q 80 40 160 160 T 320 160" fill="none" stroke="#C9A24B" stroke-width="0.75" stroke-opacity="0.12" />
      <path d="M 0 160 Q 80 60 160 160 T 320 160" fill="none" stroke="#C9A24B" stroke-width="0.75" stroke-opacity="0.10" />
      <path d="M 0 160 Q 80 80 160 160 T 320 160" fill="none" stroke="#C9A24B" stroke-width="0.75" stroke-opacity="0.09" />
      <path d="M 0 160 Q 80 100 160 160 T 320 160" fill="none" stroke="#C9A24B" stroke-width="0.75" stroke-opacity="0.08" />
      <path d="M 0 160 Q 80 120 160 160 T 320 160" fill="none" stroke="#C9A24B" stroke-width="0.75" stroke-opacity="0.07" />
      <path d="M 0 160 Q 80 140 160 160 T 320 160" fill="none" stroke="#C9A24B" stroke-width="0.75" stroke-opacity="0.06" />
      
      <!-- Ondas invertidas entrelaçadas -->
      <path d="M 0 160 Q 80 180 160 160 T 320 160" fill="none" stroke="#C9A24B" stroke-width="0.75" stroke-opacity="0.06" />
      <path d="M 0 160 Q 80 200 160 160 T 320 160" fill="none" stroke="#C9A24B" stroke-width="0.75" stroke-opacity="0.07" />
      <path d="M 0 160 Q 80 220 160 160 T 320 160" fill="none" stroke="#C9A24B" stroke-width="0.75" stroke-opacity="0.08" />
      <path d="M 0 160 Q 80 240 160 160 T 320 160" fill="none" stroke="#C9A24B" stroke-width="0.75" stroke-opacity="0.09" />
      <path d="M 0 160 Q 80 260 160 160 T 320 160" fill="none" stroke="#C9A24B" stroke-width="0.75" stroke-opacity="0.10" />
      <path d="M 0 160 Q 80 280 160 160 T 320 160" fill="none" stroke="#C9A24B" stroke-width="0.75" stroke-opacity="0.12" />

      <!-- Cruzamento vertical de micro-ondas -->
      <path d="M 160 0 Q 40 80 160 160 T 160 320" fill="none" stroke="#8FA0BD" stroke-width="0.5" stroke-opacity="0.08" />
      <path d="M 160 0 Q 60 80 160 160 T 160 320" fill="none" stroke="#8FA0BD" stroke-width="0.5" stroke-opacity="0.07" />
      <path d="M 160 0 Q 80 80 160 160 T 160 320" fill="none" stroke="#8FA0BD" stroke-width="0.5" stroke-opacity="0.06" />
      <path d="M 160 0 Q 240 80 160 160 T 160 320" fill="none" stroke="#8FA0BD" stroke-width="0.5" stroke-opacity="0.06" />
      <path d="M 160 0 Q 260 80 160 160 T 160 320" fill="none" stroke="#8FA0BD" stroke-width="0.5" stroke-opacity="0.07" />
      <path d="M 160 0 Q 280 80 160 160 T 160 320" fill="none" stroke="#8FA0BD" stroke-width="0.5" stroke-opacity="0.08" />
      
      <!-- Rosácea numismática central sutil -->
      <circle cx="160" cy="160" r="48" fill="none" stroke="#C9A24B" stroke-width="0.6" stroke-opacity="0.10" />
      <circle cx="160" cy="160" r="32" fill="none" stroke="#C9A24B" stroke-width="0.6" stroke-opacity="0.08" stroke-dasharray="2 3" />
      <circle cx="160" cy="160" r="16" fill="none" stroke="#8FA0BD" stroke-width="0.5" stroke-opacity="0.06" />
    </pattern>
  </defs>

  <!-- Fundo base mineral profundo -->
  <rect width="1920" height="1080" fill="url(#bgGlow)" />

  <!-- Camada de segurança guilloché -->
  <rect width="1920" height="1080" fill="url(#guillochePattern)" />
</svg>

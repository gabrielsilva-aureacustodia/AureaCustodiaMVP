<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <title>Estado Vazio: Cofre de Custódia Sem Moedas (Tema Escuro) - Real Olímpico</title>
  <defs>
    <style>
      .light-stroke { stroke: #B3C1DA; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .light-fill { fill: #B3C1DA; }
      .gold-stroke { stroke: #E3B95C; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .gold-fill { fill: #E3B95C; }
      .muted-stroke { stroke: #8FA0BD; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke-opacity: 0.6; }
    </style>
  </defs>

  <path d="M 55 155 L 185 155" class="muted-stroke" />

  <!-- Gaveta de custódia individualizada entreaberta -->
  <rect x="70" y="55" width="100" height="40" rx="4" fill="none" class="light-stroke" />
  <rect x="110" y="68" width="20" height="8" rx="2" class="light-fill" fill-opacity="0.3" />
  <circle cx="120" cy="85" r="3" class="gold-fill" />

  <!-- Gaveta puxada para a frente revelando almofada vazia -->
  <polygon points="60,95 180,95 168,140 72,140" fill="none" class="light-stroke" />
  <polygon points="68,102 172,102 162,135 78,135" fill="#E3B95C" fill-opacity="0.12" stroke="#E3B95C" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Ícone discreto e elegante de adição de item (+) -->
  <circle cx="120" cy="118" r="9" class="gold-stroke" fill="none" />
  <line x1="120" y1="113" x2="120" y2="123" class="gold-stroke" />
  <line x1="115" y1="118" x2="125" y2="118" class="gold-stroke" />
</svg>
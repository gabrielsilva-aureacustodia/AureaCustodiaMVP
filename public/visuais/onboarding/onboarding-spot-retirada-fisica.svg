<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <title>Retirada Física e Envio Seguro com Seguro Integral - Real Olímpico</title>
  <defs>
    <style>
      .navy-stroke { stroke: #081226; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .navy-fill { fill: #081226; }
      .gold-stroke { stroke: #C9A24B; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .gold-fill { fill: #C9A24B; }
      .muted-stroke { stroke: #8FA0BD; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .muted-fill { fill: #8FA0BD; fill-opacity: 0.15; }
    </style>
  </defs>

  <path d="M 55 155 L 185 155" class="muted-stroke" />

  <!-- Caixa de embalagem de alta segurança (isométrica suave) -->
  <!-- Topo da caixa -->
  <polygon points="120,50 165,70 120,90 75,70" fill="#FFFFFF" class="navy-stroke" />
  <!-- Lado esquerdo -->
  <polygon points="75,70 120,90 120,135 75,115" fill="#C9A24B" fill-opacity="0.08" class="navy-stroke" />
  <!-- Lado direito -->
  <polygon points="165,70 120,90 120,135 165,115" fill="#081226" fill-opacity="0.04" class="navy-stroke" />

  <!-- Fita de lacre de segurança central -->
  <polygon points="112,54 128,60 128,135 112,130" fill="#C9A24B" fill-opacity="0.25" stroke="#C9A24B" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Selo / Escudo de proteção de seguro integral flutuando à frente -->
  <path d="M 140 100 C 140 125, 155 135, 155 135 C 155 135, 170 125, 170 100 L 170 88 L 155 83 L 140 88 Z" fill="#FFFFFF" class="gold-stroke" />
  <path d="M 148 108 L 153 113 L 163 100" class="gold-stroke" />
</svg>

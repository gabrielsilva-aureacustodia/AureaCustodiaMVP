<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <title>Estado Vazio: Cofre de Custódia Sem Moedas sob Gestão - Real Olímpico</title>
  <defs>
    <style>
      .navy-stroke { stroke: #081226; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .navy-fill { fill: #081226; }
      .gold-stroke { stroke: #C9A24B; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .gold-fill { fill: #C9A24B; }
      .muted-stroke { stroke: #8FA0BD; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .muted-fill { fill: #8FA0BD; fill-opacity: 0.15; }
    </style>
  </defs>

  <path d="M 55 155 L 185 155" class="muted-stroke" />

  <!-- Gaveta de custódia individualizada entreaberta -->
  <rect x="70" y="55" width="100" height="40" rx="4" fill="#FFFFFF" class="navy-stroke" />
  <rect x="110" y="68" width="20" height="8" rx="2" fill="#081226" />
  <circle cx="120" cy="85" r="3" class="gold-fill" />

  <!-- Gaveta puxada para a frente revelando almofada vazia -->
  <polygon points="60,95 180,95 168,140 72,140" fill="#FFFFFF" class="navy-stroke" />
  <polygon points="68,102 172,102 162,135 78,135" fill="#C9A24B" fill-opacity="0.12" stroke="#C9A24B" stroke-width="1.5" stroke-dasharray="3 3" />

  <!-- Ícone discreto e elegante de adição de item (+) -->
  <circle cx="120" cy="118" r="9" class="gold-stroke" fill="#FFFFFF" />
  <line x1="120" y1="113" x2="120" y2="123" class="gold-stroke" />
  <line x1="115" y1="118" x2="125" y2="118" class="gold-stroke" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <title>Recibo Oficial de Custódia Emitido - Real Olímpico</title>
  <defs>
    <style>
      .navy-stroke { stroke: #081226; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .navy-fill { fill: #081226; }
      .gold-stroke { stroke: #C9A24B; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .gold-fill { fill: #C9A24B; }
      .muted-stroke { stroke: #8FA0BD; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .muted-fill { fill: #8FA0BD; fill-opacity: 0.15; }
      .white-fill { fill: #FFFFFF; }
      .gold-tint { fill: #C9A24B; fill-opacity: 0.12; }
    </style>
  </defs>

  <!-- Base / sombra da mesa -->
  <path d="M 50 155 L 190 155" class="navy-stroke" />
  <path d="M 70 160 L 170 160" class="muted-stroke" />

  <!-- Folha de recibo pericial em perspectiva suave -->
  <rect x="75" y="28" width="90" height="118" rx="4" class="navy-stroke" fill="#FFFFFF" />
  <!-- Guarnição de segurança interna do recibo -->
  <rect x="82" y="35" width="76" height="104" rx="2" class="gold-stroke" stroke-width="1.5" fill="#081226" fill-opacity="0.02" />

  <!-- Linhas decorativas do recibo (sem texto legível) -->
  <line x1="92" y1="48" x2="148" y2="48" class="navy-stroke" stroke-width="2" />
  <line x1="92" y1="58" x2="135" y2="58" class="muted-stroke" />
  <line x1="92" y1="68" x2="148" y2="68" class="muted-stroke" />
  <line x1="92" y1="78" x2="125" y2="78" class="muted-stroke" />

  <!-- Miniatura de moeda gravada no recibo -->
  <circle cx="104" cy="98" r="10" class="gold-stroke" stroke-width="1.5" fill="#C9A24B" fill-opacity="0.15" />
  <circle cx="104" cy="98" r="6" class="navy-stroke" stroke-width="1.2" fill="#FFFFFF" />

  <!-- Selo de lacre circular com checkmark -->
  <circle cx="145" cy="118" r="22" class="gold-fill" />
  <circle cx="145" cy="118" r="18" class="white-fill" />
  <circle cx="145" cy="118" r="15" class="gold-stroke" stroke-width="1.5" />
  
  <!-- Ícone de check de autenticidade / emissão -->
  <path d="M 137 118 L 143 124 L 154 112" class="navy-stroke" stroke-width="3" />

  <!-- Fitas do selo de lacre penduradas -->
  <path d="M 138 136 L 133 150 L 142 146 L 148 152 L 146 136" class="gold-fill" fill-opacity="0.9" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <title>Envio e Etiqueta de Frete Seguro - Real Olímpico</title>
  <defs>
    <style>
      .navy-stroke { stroke: #081226; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .navy-fill { fill: #081226; }
      .gold-stroke { stroke: #C9A24B; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .gold-fill { fill: #C9A24B; }
      .muted-stroke { stroke: #8FA0BD; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .muted-fill { fill: #8FA0BD; fill-opacity: 0.15; }
      .white-fill { fill: #FFFFFF; }
      .gold-tint { fill: #C9A24B; fill-opacity: 0.12; }
    </style>
  </defs>

  <!-- Base / sombra da mesa -->
  <path d="M 40 155 L 200 155" class="navy-stroke" />
  <path d="M 60 160 L 180 160" class="muted-stroke" />

  <!-- Caixa de envio blindada em perspectiva isométrica suave -->
  <!-- Face frontal -->
  <rect x="65" y="65" width="110" height="75" rx="3" class="navy-stroke" fill="#FFFFFF" />
  <!-- Fita de segurança central da caixa -->
  <rect x="110" y="65" width="20" height="75" class="gold-fill" fill-opacity="0.2" />
  <line x1="110" y1="65" x2="110" y2="140" class="gold-stroke" stroke-width="1.5" />
  <line x1="130" y1="65" x2="130" y2="140" class="gold-stroke" stroke-width="1.5" />

  <!-- Aba superior / tampa dobrada -->
  <path d="M 65 65 L 85 45 L 195 45 L 175 65 Z" class="navy-stroke" fill="#081226" fill-opacity="0.04" />
  <line x1="130" y1="45" x2="120" y2="65" class="gold-stroke" stroke-width="1.5" />

  <!-- Etiqueta de remessa em branco (papel algodão pericial) -->
  <rect x="75" y="80" width="45" height="50" rx="2" class="navy-stroke" stroke-width="1.5" fill="#FFFFFF" />
  <!-- Linhas decorativas da etiqueta (sem texto ou código legível) -->
  <line x1="82" y1="90" x2="112" y2="90" class="navy-stroke" stroke-width="2" />
  <line x1="82" y1="98" x2="105" y2="98" class="muted-stroke" />
  <line x1="82" y1="106" x2="110" y2="106" class="muted-stroke" />
  <line x1="82" y1="114" x2="100" y2="114" class="muted-stroke" />

  <!-- Carimbo postal geométrico (sem texto) -->
  <circle cx="152" cy="100" r="18" class="gold-stroke" stroke-width="2" stroke-dasharray="3,2" />
  <circle cx="152" cy="100" r="13" class="gold-stroke" stroke-width="1.2" />
  <path d="M 144 100 L 160 100" class="gold-stroke" stroke-width="1.5" />
  <path d="M 152 92 L 152 108" class="gold-stroke" stroke-width="1.5" />
  <circle cx="152" cy="100" r="3" class="gold-fill" />
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 180" width="240" height="180">
  <title>Retirada Física e Envio Seguro com Seguro Integral (Tema Escuro) - Real Olímpico</title>
  <defs>
    <style>
      .cream-stroke { stroke: #F5F0E4; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .cream-fill { fill: #F5F0E4; }
      .gold-stroke { stroke: #C9A24B; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; fill: none; }
      .gold-fill { fill: #C9A24B; }
      .muted-stroke { stroke: #8FA0BD; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; fill: none; stroke-opacity: 0.5; }
    </style>
  </defs>

  <path d="M 55 155 L 185 155" class="muted-stroke" />

  <!-- Caixa de embalagem de alta segurança (sem fundo branco) -->
  <!-- Topo da caixa -->
  <polygon points="120,50 165,70 120,90 75,70" fill="none" class="cream-stroke" />
  <!-- Lado esquerdo -->
  <polygon points="75,70 120,90 120,135 75,115" fill="#C9A24B" fill-opacity="0.1" class="cream-stroke" />
  <!-- Lado direito -->
  <polygon points="165,70 120,90 120,135 165,115" fill="#C9A24B" fill-opacity="0.04" class="cream-stroke" />

  <!-- Fita de lacre de segurança central -->
  <polygon points="112,54 128,60 128,135 112,130" fill="#C9A24B" fill-opacity="0.25" stroke="#C9A24B" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Selo / Escudo de proteção de seguro integral flutuando à frente -->
  <path d="M 140 100 C 140 125, 155 135, 155 135 C 155 135, 170 125, 170 100 L 170 88 L 155 83 L 140 88 Z" fill="#081226" class="gold-stroke" />
  <path d="M 148 108 L 153 113 L 163 100" class="gold-stroke" />
</svg>
